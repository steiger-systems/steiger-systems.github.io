name: hunt
description: Hide and seek in real life - private game for friends.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

# Only the packages named in PLAN.md (latlong2 is required by flutter_map).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
